name = "onpress-chat"
main = "worker.js"
compatibility_date = "2026-10-30"

[vars]
# Sites that may call this function, comma-separated, without a trailing slash.
ALLOWED_ORIGINS = "https://example.com"
OPENAI_MODEL = "gpt-6-luna"
OPENAI_REASONING_EFFORT = "low"
SYSTEM_PROMPT = "You are a helpful assistant on a website. Answer briefly, in the language of the question, use Markdown."
MAX_MESSAGES = "20"
MAX_MESSAGE_CHARS = "4000"
MAX_HISTORY_CHARS = "16000"
MAX_OUTPUT_TOKENS = "1500"

# Optional: at most 10 messages per minute from one IP address in each Cloudflare location.
# Needs Wrangler 4.36.0 or later. Remove this block if you do not want it.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
